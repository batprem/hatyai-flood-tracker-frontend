name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1020107859765/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: hatyai-cicd@dulcet-timing-340616.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        env:
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
        run: |
          gcloud run deploy hatyai-flood-frontend \
            --source . \
            --region asia-southeast1 \
            --platform managed \
            --allow-unauthenticated \
            --set-build-env-vars "VITE_API_URL=https://hatyai-flood-backend-1020107859765.asia-southeast1.run.app,VITE_MAPTILER_KEY=${VITE_MAPTILER_KEY}" \
            --project dulcet-timing-340616 \
            --quiet
